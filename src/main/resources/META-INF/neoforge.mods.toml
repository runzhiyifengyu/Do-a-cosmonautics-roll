modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

description='''
Rotates the player's body and view to align with standing surfaces (floor, wall, ceiling) in high-altitude overworld and space regions. Designed to work alongside Do a Barrel Roll, Cosmonautics (Rocketnautics) and Aeronautics. Singleplayer v1.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sable"
    type="optional"
    versionRange="[2.0.3,)"
    ordering="NONE"
    side="BOTH"
